name: dashboard

on:
  push:
    branches: [main]
    paths:
      - progress.yaml
      - curriculum/**
      - scripts/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/dsa.py dashboard
      - name: Commit regenerated files
        run: |
          git config user.name "dsa-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md mistakes.md docs/progress.json
          git diff --staged --quiet || (git commit -m "chore: refresh dashboard" && git push)
